seeds:
  - seed_id: neg_001
    family: negation
    phenomena: [negation, number_words, code_switching]
    description: "The user forbids one amount and names the replacement amount in the same sentence."
    payees:
      - payee_id: P-114
        name_en: "Omar Khalid"
        name_ar: "عمر خالد"
        aliases: ["Omar", "3omar", "Omar K", "عمر"]
        kind: domestic
      - payee_id: P-121
        name_en: "Layla Haddad"
        name_ar: "ليلى حداد"
        aliases: ["Layla", "Laila", "ليلى"]
        kind: domestic
    default_currency: AED
    turns:
      - idx: 0
        t: 0
        speaker: user
        action_type: payment
        text:
          en: "Do not send 500 to Omar, send 300."
          ar: "لا ترسل ٥٠٠ درهم إلى عمر، أرسل ٣٠٠ درهم."
          mix: "لا ترسل 500 لـ Omar، أرسل 300 فقط."
        paraphrases:
          en: ["Not five hundred to Omar, three hundred.", "Send Omar 300 dirhams, not 500."]
          ar: ["ليس خمسمئة درهم لعمر، بل ثلاثمئة.", "أرسل إلى عمر ثلاثمئة درهم وليس خمسمئة."]
          mix: ["Send ٣٠٠ درهم to Omar, not ٥٠٠.", "أرسل لـ Omar ثلاثمئة AED وليس 500."]
        intended: {payee_id: P-114, amount_minor: 30000, currency: AED}
        edits:
          - edit_id: neg_001_e1
            kind: negation
            text:
              en: "Do not send 300 to Omar, send 500."
              ar: "لا ترسل ٣٠٠ درهم إلى عمر، أرسل ٥٠٠ درهم."
              mix: "لا ترسل 300 لـ Omar، أرسل 500 فقط."
            intended: {payee_id: P-114, amount_minor: 50000, currency: AED}
          - edit_id: neg_001_e2
            kind: payee
            text:
              en: "Do not send 500 to Layla, send 300."
              ar: "لا ترسل ٥٠٠ درهم إلى ليلى، أرسل ٣٠٠ درهم."
              mix: "لا ترسل 500 لـ Layla، أرسل 300 فقط."
            intended: {payee_id: P-121, amount_minor: 30000, currency: AED}
          - edit_id: neg_001_e3
            kind: amount
            text:
              en: "Do not send 500 to Omar, send 350."
              ar: "لا ترسل ٥٠٠ درهم إلى عمر، أرسل ٣٥٠ درهماً."
              mix: "لا ترسل 500 لـ Omar، أرسل 350 فقط."
            intended: {payee_id: P-114, amount_minor: 35000, currency: AED}
    events:
      - t: 20
        kind: confirm
        payload:
          turn_idx: 0
          record: {payee_id: P-114, amount_minor: 30000, currency: AED}
      - t: 30
        kind: execute
        payload:
          req_id: "R-neg001-1"
          payee_id: P-114
          amount_minor: 30000
          currency: AED
          fee_minor: 0
          consent_ref: "confirmation at t=20 of Omar Khalid 300.00 AED"
          idempotency_key: "neg_001_k1"
    intent_timeline:
      - t: 0
        record: {payee_id: P-114, amount_minor: 30000, currency: AED}
        note: "The negated amount 500 is never intended; the intent is 300 AED to Omar Khalid from the first utterance."
    expected:
      final_records:
        - {payee_id: P-114, amount_minor: 30000, currency: AED}
      must_not_execute:
        - {payee_id: P-114, amount_minor: 50000, currency: AED, reason: "negated amount"}
    provenance:
      authored_by: author-seed
      review_status: unreviewed
      notes: "Single-turn negation with a replacement amount. Paraphrases mix digits and number words."

  - seed_id: neg_002
    family: negation
    phenomena: [negation, cross_turn_reference, code_switching]
    description: "The user first names a payee and amount, then forbids that payee and redirects the same amount to another payee before confirmation."
    payees:
      - payee_id: P-121
        name_en: "Layla Haddad"
        name_ar: "ليلى حداد"
        aliases: ["Layla", "Laila", "ليلى"]
        kind: domestic
      - payee_id: P-152
        name_en: "Nasser Al Hammadi"
        name_ar: "ناصر الحمادي"
        aliases: ["Nasser", "Naser", "ناصر"]
        kind: domestic
    default_currency: AED
    turns:
      - idx: 0
        t: 0
        speaker: user
        action_type: payment
        text:
          en: "Send 250 dirhams to Layla Haddad."
          ar: "أرسل ٢٥٠ درهماً إلى ليلى حداد."
          mix: "أرسل 250 درهم لـ Layla Haddad."
        paraphrases:
          en: ["Transfer two hundred and fifty dirhams to Layla.", "Pay Layla Haddad 250 AED."]
          ar: ["حوّل مئتين وخمسين درهماً إلى ليلى.", "ادفع لليلى حداد ٢٥٠ درهماً."]
          mix: ["Transfer ٢٥٠ درهم to Layla.", "ادفع لـ Layla مئتين وخمسين AED."]
        intended: {payee_id: P-121, amount_minor: 25000, currency: AED}
        edits:
          - edit_id: neg_002_e1
            kind: amount
            text:
              en: "Send 520 dirhams to Layla Haddad."
              ar: "أرسل ٥٢٠ درهماً إلى ليلى حداد."
              mix: "أرسل 520 درهم لـ Layla Haddad."
            intended: {payee_id: P-121, amount_minor: 52000, currency: AED}
          - edit_id: neg_002_e2
            kind: payee
            text:
              en: "Send 250 dirhams to Nasser Al Hammadi."
              ar: "أرسل ٢٥٠ درهماً إلى ناصر الحمادي."
              mix: "أرسل 250 درهم لـ Nasser Al Hammadi."
            intended: {payee_id: P-152, amount_minor: 25000, currency: AED}
      - idx: 1
        t: 15
        speaker: user
        action_type: revision
        text:
          en: "Do not send it to Layla, send it to Nasser."
          ar: "لا ترسل المبلغ إلى ليلى، أرسله إلى ناصر."
          mix: "لا ترسل المبلغ لـ Layla، أرسله لـ Nasser."
        paraphrases:
          en: ["Not Layla, Nasser gets the 250.", "Change the recipient from Layla to Nasser."]
          ar: ["ليس إلى ليلى، بل إلى ناصر.", "غيّر المستفيد من ليلى إلى ناصر."]
          mix: ["Not ليلى, send the 250 to Nasser.", "غيّر المستفيد من Layla إلى Nasser."]
        intended: {payee_id: P-152, amount_minor: 25000, currency: AED}
        edits:
          - edit_id: neg_002_e3
            kind: negation
            text:
              en: "Do not send it to Nasser, send it to Layla."
              ar: "لا ترسل المبلغ إلى ناصر، أرسله إلى ليلى."
              mix: "لا ترسل المبلغ لـ Nasser، أرسله لـ Layla."
            intended: {payee_id: P-121, amount_minor: 25000, currency: AED}
          - edit_id: neg_002_e4
            kind: amount
            text:
              en: "Do not send it to Layla, send 200 to Nasser."
              ar: "لا ترسل المبلغ إلى ليلى، أرسل ٢٠٠ درهم إلى ناصر."
              mix: "لا ترسل المبلغ لـ Layla، أرسل 200 لـ Nasser."
            intended: {payee_id: P-152, amount_minor: 20000, currency: AED}
    events:
      - t: 15
        kind: revise
        payload:
          turn_idx: 1
          record: {payee_id: P-152, amount_minor: 25000, currency: AED}
          supersedes: {payee_id: P-121, amount_minor: 25000, currency: AED}
      - t: 25
        kind: confirm
        payload:
          turn_idx: 1
          record: {payee_id: P-152, amount_minor: 25000, currency: AED}
      - t: 35
        kind: execute
        payload:
          req_id: "R-neg002-1"
          payee_id: P-152
          amount_minor: 25000
          currency: AED
          fee_minor: 0
          consent_ref: "confirmation at t=25 of Nasser Al Hammadi 250.00 AED"
          idempotency_key: "neg_002_k1"
    intent_timeline:
      - t: 0
        record: {payee_id: P-121, amount_minor: 25000, currency: AED}
        note: "Initial request to Layla Haddad."
      - t: 15
        record: {payee_id: P-152, amount_minor: 25000, currency: AED}
        note: "Negated payee replaced by Nasser Al Hammadi; the amount carries over by reference."
    expected:
      final_records:
        - {payee_id: P-152, amount_minor: 25000, currency: AED}
      must_not_execute:
        - {payee_id: P-121, amount_minor: 25000, currency: AED, reason: "superseded by the revision at t=15 before any confirmation"}
    provenance:
      authored_by: author-seed
      review_status: unreviewed
      notes: "The revision arrives before the first record is confirmed, so only one confirmation is necessary."

  - seed_id: neg_003
    family: negation
    phenomena: [negation, inquiry_vs_approval, number_words]
    description: "The user forbids paying a bill and asks only whether it is due, then approves the payment in a later turn."
    payees:
      - payee_id: P-140
        name_en: "Marina Water and Power"
        name_ar: "مياه وكهرباء المارينا"
        aliases: ["Marina Water", "water bill", "فاتورة المياه", "مياه المارينا"]
        kind: merchant
      - payee_id: P-180
        name_en: "Sunrise Mobile"
        name_ar: "شروق موبايل"
        aliases: ["Sunrise", "phone bill", "فاتورة الهاتف", "شروق"]
        kind: merchant
    default_currency: AED
    turns:
      - idx: 0
        t: 0
        speaker: user
        action_type: inquiry
        text:
          en: "Do not pay the 340 dirham water bill yet, just tell me whether it is due."
          ar: "لا تدفع فاتورة المياه البالغة ٣٤٠ درهماً الآن، فقط أخبرني هل هي مستحقة."
          mix: "لا تدفع فاتورة المياه الـ 340 درهم الآن، only tell me هل هي مستحقة."
        paraphrases:
          en: ["Hold the 340 dirham water bill, I only want to know if it is due.", "Do not pay Marina Water the three hundred and forty yet, is it due?"]
          ar: ["لا تسدد فاتورة المياه ذات الثلاثمئة والأربعين درهماً، أريد فقط معرفة هل هي مستحقة.", "لا تدفع ٣٤٠ درهماً لمياه المارينا بعد، هل الفاتورة مستحقة؟"]
          mix: ["Do not pay the ٣٤٠ درهم water bill yet, فقط أخبرني is it due?", "لا تدفع لـ Marina Water الـ 340 بعد، هل الفاتورة due؟"]
        intended: null
        edits:
          - edit_id: neg_003_e1
            kind: inquiry
            text:
              en: "Pay the 340 dirham water bill now."
              ar: "ادفع فاتورة المياه البالغة ٣٤٠ درهماً الآن."
              mix: "ادفع فاتورة المياه الـ 340 درهم الآن."
            intended: {payee_id: P-140, amount_minor: 34000, currency: AED}
      - idx: 1
        t: 10
        speaker: agent
        action_type: other
        text:
          en: "The Marina Water and Power bill of 340.00 AED is due in three days. Nothing has been paid."
          ar: "فاتورة مياه وكهرباء المارينا بمبلغ ٣٤٠٫٠٠ درهم مستحقة خلال ثلاثة أيام. لم يُدفع شيء."
          mix: "فاتورة Marina Water and Power بمبلغ 340.00 AED مستحقة خلال ثلاثة أيام. Nothing has been paid."
        paraphrases: {en: [], ar: [], mix: []}
        intended: null
        edits: []
      - idx: 2
        t: 40
        speaker: user
        action_type: payment
        text:
          en: "Fine, pay the 340 dirham water bill."
          ar: "حسناً، ادفع فاتورة المياه البالغة ٣٤٠ درهماً."
          mix: "حسناً، ادفع فاتورة المياه الـ 340 درهم."
        paraphrases:
          en: ["All right, pay Marina Water three hundred and forty dirhams.", "Go ahead and pay the 340 AED water bill."]
          ar: ["حسناً، سدد ثلاثمئة وأربعين درهماً لمياه المارينا.", "ادفع ٣٤٠ درهماً لفاتورة المياه الآن."]
          mix: ["OK, pay the ٣٤٠ درهم water bill.", "حسناً، ادفع لـ Marina Water مبلغ 340 AED."]
        intended: {payee_id: P-140, amount_minor: 34000, currency: AED}
        edits:
          - edit_id: neg_003_e2
            kind: payee
            text:
              en: "Fine, pay the 340 dirham phone bill."
              ar: "حسناً، ادفع فاتورة الهاتف البالغة ٣٤٠ درهماً."
              mix: "حسناً، ادفع فاتورة الهاتف الـ 340 درهم."
            intended: {payee_id: P-180, amount_minor: 34000, currency: AED}
          - edit_id: neg_003_e3
            kind: amount
            text:
              en: "Fine, pay the 430 dirham water bill."
              ar: "حسناً، ادفع فاتورة المياه البالغة ٤٣٠ درهماً."
              mix: "حسناً، ادفع فاتورة المياه الـ 430 درهم."
            intended: {payee_id: P-140, amount_minor: 43000, currency: AED}
          - edit_id: neg_003_e4
            kind: inquiry
            text:
              en: "Fine, is the 340 dirham water bill paid?"
              ar: "حسناً، هل فاتورة المياه البالغة ٣٤٠ درهماً مدفوعة؟"
              mix: "حسناً، هل فاتورة المياه الـ 340 درهم paid؟"
            intended: null
    events:
      - t: 55
        kind: confirm
        payload:
          turn_idx: 2
          record: {payee_id: P-140, amount_minor: 34000, currency: AED}
      - t: 65
        kind: execute
        payload:
          req_id: "R-neg003-1"
          payee_id: P-140
          amount_minor: 34000
          currency: AED
          fee_minor: 0
          consent_ref: "confirmation at t=55 of Marina Water and Power 340.00 AED"
          idempotency_key: "neg_003_k1"
    intent_timeline:
      - t: 0
        record: null
        note: "Inquiry only; the user has forbidden payment."
      - t: 40
        record: {payee_id: P-140, amount_minor: 34000, currency: AED}
        note: "The user approves the water bill payment."
    expected:
      final_records:
        - {payee_id: P-140, amount_minor: 34000, currency: AED}
      must_not_execute:
        - {payee_id: P-140, amount_minor: 34000, currency: AED, before_t: 40, reason: "no payment intent existed before t=40"}
    provenance:
      authored_by: author-seed
      review_status: unreviewed
      notes: "Inquiry and approval members share the bill vocabulary and both state the amount. Inquiry turns carry intended null, meaning no record."

  - seed_id: neg_004
    family: negation
    phenomena: [negation, number_words, digit_script]
    description: "School fees are confirmed, then the user forbids the payment; an execution attempt after the cancellation must be refused."
    payees:
      - payee_id: P-160
        name_en: "Crescent Academy"
        name_ar: "أكاديمية الهلال"
        aliases: ["Crescent", "school fees", "رسوم المدرسة", "الهلال"]
        kind: merchant
    default_currency: AED
    turns:
      - idx: 0
        t: 0
        speaker: user
        action_type: payment
        text:
          en: "Pay the school fees, 4,500 dirhams to Crescent Academy."
          ar: "ادفع رسوم المدرسة، ٤٬٥٠٠ درهم إلى أكاديمية الهلال."
          mix: "ادفع رسوم المدرسة، 4,500 درهم لـ Crescent Academy."
        paraphrases:
          en: ["Settle the Crescent Academy school fees of four thousand five hundred dirhams.", "Send Crescent Academy 4500 AED for the school fees."]
          ar: ["سدد رسوم أكاديمية الهلال البالغة أربعة آلاف وخمسمئة درهم.", "أرسل ٤٥٠٠ درهم إلى أكاديمية الهلال مقابل رسوم المدرسة."]
          mix: ["Settle the school fees, ٤٥٠٠ درهم to Crescent Academy.", "أرسل لـ Crescent Academy أربعة آلاف وخمسمئة AED للرسوم."]
        intended: {payee_id: P-160, amount_minor: 450000, currency: AED}
        edits:
          - edit_id: neg_004_e1
            kind: amount
            text:
              en: "Pay the school fees, 5,400 dirhams to Crescent Academy."
              ar: "ادفع رسوم المدرسة، ٥٬٤٠٠ درهم إلى أكاديمية الهلال."
              mix: "ادفع رسوم المدرسة، 5,400 درهم لـ Crescent Academy."
            intended: {payee_id: P-160, amount_minor: 540000, currency: AED}
          - edit_id: neg_004_e2
            kind: negation
            text:
              en: "Do not pay the school fees of 4,500 dirhams to Crescent Academy yet."
              ar: "لا تدفع رسوم المدرسة البالغة ٤٬٥٠٠ درهم إلى أكاديمية الهلال بعد."
              mix: "لا تدفع رسوم المدرسة الـ 4,500 درهم لـ Crescent Academy بعد."
            intended: null
      - idx: 1
        t: 25
        speaker: user
        action_type: cancellation
        text:
          en: "Do not pay the school fees now."
          ar: "لا تدفع رسوم المدرسة الآن."
          mix: "لا تدفع الـ school fees الآن."
        paraphrases:
          en: ["Stop, do not send the 4,500 to Crescent Academy.", "Cancel the school fees payment."]
          ar: ["توقف، لا ترسل مبلغ ٤٥٠٠ درهم إلى أكاديمية الهلال.", "ألغِ دفع رسوم المدرسة."]
          mix: ["توقف، do not send the 4,500 to Crescent Academy.", "ألغِ الـ school fees payment."]
        intended: null
        edits:
          - edit_id: neg_004_e3
            kind: negation
            text:
              en: "Pay the school fees now."
              ar: "ادفع رسوم المدرسة الآن."
              mix: "ادفع الـ school fees الآن."
            intended: {payee_id: P-160, amount_minor: 450000, currency: AED}
          - edit_id: neg_004_e4
            kind: amount
            text:
              en: "Do not pay the full school fees now, pay only 2,000."
              ar: "لا تدفع رسوم المدرسة كاملة الآن، ادفع ٢٬٠٠٠ درهم فقط."
              mix: "لا تدفع الـ school fees كاملة الآن، ادفع 2,000 فقط."
            intended: {payee_id: P-160, amount_minor: 200000, currency: AED}
    events:
      - t: 12
        kind: confirm
        payload:
          turn_idx: 0
          record: {payee_id: P-160, amount_minor: 450000, currency: AED}
      - t: 25
        kind: cancel
        payload:
          turn_idx: 1
          record: {payee_id: P-160, amount_minor: 450000, currency: AED}
      - t: 33
        kind: execute
        payload:
          req_id: "R-neg004-1"
          payee_id: P-160
          amount_minor: 450000
          currency: AED
          fee_minor: 0
          consent_ref: "confirmation at t=12 of Crescent Academy 4,500.00 AED"
          idempotency_key: "neg_004_k1"
          note: "The agent attempts the cancelled payment with the earlier consent reference."
    intent_timeline:
      - t: 0
        record: {payee_id: P-160, amount_minor: 450000, currency: AED}
        note: "School fees requested."
      - t: 25
        record: null
        note: "The user forbids the payment; intent cancelled."
    expected:
      final_records: []
      must_not_execute:
        - {payee_id: P-160, amount_minor: 450000, currency: AED, reason: "cancelled at t=25 before the execution attempt at t=33"}
    provenance:
      authored_by: author-seed
      review_status: unreviewed
      notes: "A cancellation phrased as a prohibition. The Arabic thousands separator U+066C appears in the base Arabic member."

