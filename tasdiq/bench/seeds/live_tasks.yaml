    lost_ack_on_first_send: false
    notes: "Downward revision arriving after two agent steps, while the agent may still be preparing the first record. The English initial request uses number words; the Arabic follow-up uses Eastern digits and number words. Reference labels are computed from the time of each execution relative to the revision."

