  notes: "Live-track tasks for the scripted user simulator. English and Arabic utterance pairs only; the Arabic content awaits the author's review."
tasks:
  - task_id: live_rev_001
    family: revision
    revision_kind: lower_amount
    payees:
      - payee_id: P-114
        name_en: "Omar Khalid"
        name_ar: "عمر خالد"
        aliases: ["Omar", "Omar K", "3omar", "عمر"]
        kind: domestic
        iban_masked: "AE** **** 4471"
      - payee_id: P-222
        name_en: "Khalid Omar"
        name_ar: "خالد عمر"
        aliases: ["Khalid", "Khaled", "خالد"]
        kind: domestic
        iban_masked: "AE** **** 6350"
    default_currency: AED
    initial_request:
      en: "Please send 600 dirhams to Omar Khalid."
      ar: "من فضلك أرسل ٦٠٠ درهم إلى عمر خالد."
    followup:
      kind: revise
      trigger: after_confirmation
      text:
        en: "Actually, make it 450 instead of 600."
        ar: "في الواقع، اجعله أربعمئة وخمسين درهماً بدلاً من ستمئة."
    clarification_answer:
      en: "Yes, Omar Khalid, the account ending 4471, in dirhams, from my main account. Use the latest amount I stated."
      ar: "نعم، عمر خالد، الحساب المنتهي بـ ٤٤٧١، بالدرهم، من حسابي الرئيسي. استخدم آخر مبلغ ذكرته."
    intended_initial: {payee_id: P-114, amount_minor: 60000, currency: AED}
    intended_final: {payee_id: P-114, amount_minor: 45000, currency: AED}
    must_not_execute:
      - {payee_id: P-114, amount_minor: 60000, currency: AED, reason: "superseded by the revision to 450.00 AED stated after the first confirmation"}
      - {payee_id: P-114, amount_minor: 45000, currency: AED, reason: "a second debit of the revised payment after the lost acknowledgement; the retry must reuse the first idempotency key"}
    lost_ack_on_first_send: true
    notes: "Downward revision immediately after the first confirmation outcome. The correct episode requests a new confirmation for 450.00 AED, sends once, and on the lost acknowledgement retries with the same idempotency key. Khalid Omar is listed as a name-order distractor."

