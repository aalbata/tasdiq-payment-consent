seeds:
  - seed_id: rev_001
    family: revision
    phenomena: [number_words, digit_script, code_switching]
    description: "A confirmed transfer is lowered by the user before execution, so the second confirmation is necessary under invalidate-on-change and unnecessary under narrowing."
    payees:
      - payee_id: P-114
        name_en: "Omar Khalid"
        name_ar: "عمر خالد"
        aliases: ["Omar", "3omar", "Omar K", "عمر"]
        kind: domestic
      - payee_id: P-121
        name_en: "Layla Haddad"
        name_ar: "ليلى حداد"
        aliases: ["Layla", "Laila", "ليلى"]
        kind: domestic
    default_currency: AED
    turns:
      - idx: 0
        t: 0
        speaker: user
        action_type: payment
        text:
          en: "Send 600 dirhams to Omar Khalid."
          ar: "أرسل ٦٠٠ درهم إلى عمر خالد."
          mix: "أرسل 600 درهم لـ Omar Khalid."
        paraphrases:
          en: ["Transfer six hundred AED to Omar.", "Pay Omar Khalid 600 AED."]
          ar: ["حوّل ستمئة درهم إلى عمر.", "ادفع لعمر خالد ٦٠٠ درهم."]
          mix: ["Transfer ٦٠٠ درهم to Omar.", "ادفع لـ 3omar ستمئة AED."]
        intended: {payee_id: P-114, amount_minor: 60000, currency: AED}
        edits:
          - edit_id: rev_001_e1
            kind: amount
            text:
              en: "Send 660 dirhams to Omar Khalid."
              ar: "أرسل ٦٦٠ درهماً إلى عمر خالد."
              mix: "أرسل 660 درهم لـ Omar Khalid."
            intended: {payee_id: P-114, amount_minor: 66000, currency: AED}
          - edit_id: rev_001_e2
            kind: payee
            text:
              en: "Send 600 dirhams to Layla Haddad."
              ar: "أرسل ٦٠٠ درهم إلى ليلى حداد."
              mix: "أرسل 600 درهم لـ Layla Haddad."
            intended: {payee_id: P-121, amount_minor: 60000, currency: AED}
          - edit_id: rev_001_e3
            kind: inquiry
            text:
              en: "Has the 600 dirhams to Omar Khalid gone out?"
              ar: "هل أُرسلت الـ٦٠٠ درهم إلى عمر خالد؟"
              mix: "هل أُرسلت الـ 600 درهم لـ Omar Khalid؟"
            intended: null
      - idx: 1
        t: 30
        speaker: user
        action_type: revision
        text:
          en: "Make it 450 instead of 600."
          ar: "اجعله أربعمئة وخمسين درهماً بدلاً من ستمئة."
          mix: "اجعله 450 بدلاً من 600 لـ Omar."
        paraphrases:
          en: ["Change the amount to Omar to four hundred and fifty.", "Reduce it to 450 dirhams."]
          ar: ["غيّر المبلغ المرسل إلى عمر إلى ٤٥٠ درهماً.", "خفّضه إلى أربعمئة وخمسين درهماً."]
          mix: ["Change the amount لعمر to ٤٥٠.", "خفّض الـ transfer إلى 450 AED."]
        intended: {payee_id: P-114, amount_minor: 45000, currency: AED}
        edits:
          - edit_id: rev_001_e4
            kind: amount
            text:
              en: "Make it 540 instead of 600."
              ar: "اجعله خمسمئة وأربعين درهماً بدلاً من ستمئة."
              mix: "اجعله 540 بدلاً من 600 لـ Omar."
            intended: {payee_id: P-114, amount_minor: 54000, currency: AED}
          - edit_id: rev_001_e5
            kind: negation
            text:
              en: "Keep it at 600, do not change it."
              ar: "أبقه عند ستمئة درهم، لا تغيّره."
              mix: "أبقه عند 600، do not change it."
            intended: {payee_id: P-114, amount_minor: 60000, currency: AED}
          - edit_id: rev_001_e6
            kind: payee
            text:
              en: "Make it 450 to Layla instead."
              ar: "اجعله أربعمئة وخمسين درهماً إلى ليلى بدلاً من ذلك."
              mix: "اجعله 450 لـ Layla بدلاً من ذلك."
            intended: {payee_id: P-121, amount_minor: 45000, currency: AED}
    events:
      - t: 14
        kind: confirm
        payload:
          turn_idx: 0
          record: {payee_id: P-114, amount_minor: 60000, currency: AED}
      - t: 30
        kind: revise
        payload:
          turn_idx: 1
          record: {payee_id: P-114, amount_minor: 45000, currency: AED}
          supersedes: {payee_id: P-114, amount_minor: 60000, currency: AED}
      - t: 42
        kind: confirm
        payload:
          turn_idx: 1
          record: {payee_id: P-114, amount_minor: 45000, currency: AED}
      - t: 50
        kind: execute
        payload:
          payee_id: P-114
          amount_minor: 45000
          currency: AED
          consent_ref: "confirmation at t=42 of Omar Khalid 450.00 AED"
          idempotency_key: "rev_001_k1"
    intent_timeline:
      - t: 0
        record: {payee_id: P-114, amount_minor: 60000, currency: AED}
        note: "Initial request of 600 AED to Omar Khalid."
      - t: 30
        record: {payee_id: P-114, amount_minor: 45000, currency: AED}
        note: "The user lowers the amount to 450 AED after the first confirmation."
    expected:
      final_records:
        - {payee_id: P-114, amount_minor: 45000, currency: AED}
      must_not_execute:
        - {payee_id: P-114, amount_minor: 60000, currency: AED, reason: "superseded by the revision at t=30 after it was confirmed at t=14"}
    provenance:
      authored_by: author-seed
      review_status: unreviewed
      notes: "Downward revision of a confirmed record with no attempt on the old record. The second confirmation is necessary under invalidate-on-change and unnecessary under the narrowing rule (same payee and currency, lower amount)."

