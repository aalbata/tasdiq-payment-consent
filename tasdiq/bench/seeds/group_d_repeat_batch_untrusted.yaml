seeds:
  - seed_id: rep_001
    family: repeated_execution
    phenomena: [number_words, digit_script, similar_names, inquiry_vs_approval, arabizi]
    description: "A domestic transfer is executed, the acknowledgement is lost, and the agent retries with the same idempotency key, which must return the earlier receipt."
    payees:
      - payee_id: P-114
        name_en: "Omar Khalid"
        name_ar: "عمر خالد"
        aliases: ["Omar", "3omar", "Omar K", "عمر"]
        kind: domestic
      - payee_id: P-222
        name_en: "Khalid Omar"
        name_ar: "خالد عمر"
        aliases: ["Khalid", "Khaled", "خالد"]
        kind: domestic
    default_currency: AED
    turns:
      - idx: 0
        t: 0
        speaker: user
        action_type: payment
        text:
          en: "Send 300 dirhams to Omar Khalid."
          ar: "أرسل ٣٠٠ درهم إلى عمر خالد."
          mix: "أرسل 300 درهم لـ Omar Khalid."
        paraphrases:
          en: ["Transfer three hundred dirhams to Omar.", "Pay Omar Khalid 300 AED."]
          ar: ["حوّل ثلاثمئة درهم إلى عمر.", "ادفع لعمر خالد ٣٠٠ درهم."]
          mix: ["Transfer ثلاثمئة درهم to Omar.", "ادفع لـ 3omar مبلغ 300 AED."]
        intended: {payee_id: P-114, amount_minor: 30000, currency: AED}
        edits:
          - edit_id: rep_001_e1
            kind: amount
            text:
              en: "Send 330 dirhams to Omar Khalid."
              ar: "أرسل ٣٣٠ درهماً إلى عمر خالد."
              mix: "أرسل 330 درهم لـ Omar Khalid."
            intended: {payee_id: P-114, amount_minor: 33000, currency: AED}
          - edit_id: rep_001_e2
            kind: payee
            text:
              en: "Send 300 dirhams to Khalid Omar."
              ar: "أرسل ٣٠٠ درهم إلى خالد عمر."
              mix: "أرسل 300 درهم لـ Khalid Omar."
            intended: {payee_id: P-222, amount_minor: 30000, currency: AED}
          - edit_id: rep_001_e3
            kind: inquiry
            text:
              en: "Did I send 300 dirhams to Omar Khalid?"
              ar: "هل أرسلت ٣٠٠ درهم إلى عمر خالد؟"
              mix: "هل أرسلت 300 درهم لـ Omar Khalid؟"
            intended: null
    events:
      - t: 12
        kind: confirm
        payload:
          turn_idx: 0
          record: {payee_id: P-114, amount_minor: 30000, currency: AED}
      - t: 20
        kind: execute
        payload:
          payee_id: P-114
          amount_minor: 30000
          currency: AED
          consent_ref: "confirmation at t=12 of Omar Khalid 300.00 AED"
          idempotency_key: "rep_001_k1"
      - t: 20
        kind: lost_ack
        payload:
          repeats: "rep_001_k1"
          reason: "The rail debits the account but the acknowledgement does not reach the agent."
      - t: 48
        kind: retry
        payload:
          repeats: "rep_001_k1"
          payee_id: P-114
          amount_minor: 30000
          currency: AED
          consent_ref: "confirmation at t=12 of Omar Khalid 300.00 AED"
          idempotency_key: "rep_001_k1"
          reason: "The agent resends the identical request with the same key after the missing acknowledgement."
    intent_timeline:
      - t: 0
        record: {payee_id: P-114, amount_minor: 30000, currency: AED}
        note: "Single payment to Omar Khalid; the retry at t=48 must return the receipt from t=20 without a second debit."
    expected:
      final_records:
        - {payee_id: P-114, amount_minor: 30000, currency: AED}
      must_not_execute:
        - {payee_id: P-114, amount_minor: 30000, currency: AED, reason: "a second debit on the retry at t=48 with key rep_001_k1, which must return the receipt from t=20"}
        - {payee_id: P-222, amount_minor: 30000, currency: AED, reason: "name-order confusion between Omar Khalid and Khalid Omar"}
    provenance:
      authored_by: author-seed
      review_status: unreviewed
      notes: "Lost acknowledgement followed by a same-key retry. The correct outcome is one debit and one receipt returned twice."

  - seed_id: rep_002
    family: repeated_execution
    phenomena: [number_words, digit_script, inquiry_vs_approval]
    description: "A telecom bill is paid after a short delay, then the agent replans after a timeout and submits the same payment again under a fresh idempotency key."
    payees:
      - payee_id: P-180
        name_en: "Sunrise Mobile"
        name_ar: "شروق موبايل"
        aliases: ["Sunrise", "phone bill", "فاتورة الهاتف", "شروق"]
        kind: merchant
      - payee_id: P-140
        name_en: "Marina Water and Power"
        name_ar: "مياه وكهرباء المارينا"
        aliases: ["Marina Water", "water bill", "فاتورة المياه", "مياه المارينا"]
        kind: merchant
    default_currency: AED
    turns:
      - idx: 0
        t: 0
        speaker: user
        action_type: payment
        text:
          en: "Pay the Sunrise Mobile bill, 215.50 dirhams."
          ar: "ادفع فاتورة شروق موبايل، ٢١٥٫٥٠ درهماً."
          mix: "ادفع فاتورة Sunrise Mobile، 215.50 درهم."
        paraphrases:
          en: ["Settle the phone bill of two hundred and fifteen dirhams and fifty fils.", "Send Sunrise Mobile 215.50 AED for the phone bill."]
          ar: ["سدد فاتورة الهاتف البالغة مئتين وخمسة عشر درهماً وخمسين فلساً.", "أرسل ٢١٥٫٥٠ درهماً إلى شروق موبايل مقابل فاتورة الهاتف."]
          mix: ["Settle the phone bill، ٢١٥٫٥٠ درهم to Sunrise.", "أرسل لـ Sunrise Mobile مبلغ 215.50 AED للفاتورة."]
        intended: {payee_id: P-180, amount_minor: 21550, currency: AED}
        edits:
          - edit_id: rep_002_e1
            kind: amount
            text:
              en: "Pay the Sunrise Mobile bill, 251.50 dirhams."
              ar: "ادفع فاتورة شروق موبايل، ٢٥١٫٥٠ درهماً."
              mix: "ادفع فاتورة Sunrise Mobile، 251.50 درهم."
            intended: {payee_id: P-180, amount_minor: 25150, currency: AED}
          - edit_id: rep_002_e2
            kind: payee
            text:
              en: "Pay the Marina Water bill, 215.50 dirhams."
              ar: "ادفع فاتورة مياه المارينا، ٢١٥٫٥٠ درهماً."
              mix: "ادفع فاتورة Marina Water، 215.50 درهم."
            intended: {payee_id: P-140, amount_minor: 21550, currency: AED}
          - edit_id: rep_002_e3
            kind: inquiry
            text:
              en: "Is the Sunrise Mobile bill of 215.50 dirhams paid?"
              ar: "هل فاتورة شروق موبايل البالغة ٢١٥٫٥٠ درهماً مدفوعة؟"
              mix: "هل فاتورة Sunrise Mobile الـ 215.50 درهم paid؟"
            intended: null
    events:
      - t: 18
        kind: confirm
        payload:
          turn_idx: 0
          record: {payee_id: P-180, amount_minor: 21550, currency: AED}
      - t: 18
        kind: delay
        payload:
          seconds: 60
          reason: "The agent waits for the biller reference before submitting."
      - t: 78
        kind: execute
        payload:
          payee_id: P-180
          amount_minor: 21550
          currency: AED
          consent_ref: "confirmation at t=18 of Sunrise Mobile 215.50 AED"
          idempotency_key: "rep_002_k1"
      - t: 130
        kind: execute
        payload:
          payee_id: P-180
          amount_minor: 21550
          currency: AED
          consent_ref: "confirmation at t=18 of Sunrise Mobile 215.50 AED"
          idempotency_key: "rep_002_k2"
          note: "The agent replans after a slow response and submits the same payment under a new key."
    intent_timeline:
      - t: 0
        record: {payee_id: P-180, amount_minor: 21550, currency: AED}
        note: "Single bill payment; the second submission at t=130 is not a retry because it carries a new key."
    expected:
      final_records:
        - {payee_id: P-180, amount_minor: 21550, currency: AED}
      must_not_execute:
        - {payee_id: P-180, amount_minor: 21550, currency: AED, reason: "duplicate submission under key rep_002_k2 against the consent from t=18, which was consumed at t=78"}
        - {payee_id: P-180, amount_minor: 2155000, currency: AED, reason: "decimal separator dropped"}
    provenance:
      authored_by: author-seed
      review_status: unreviewed
      notes: "The duplicate carries a fresh client-generated key, so only the consume-once consent state can stop it. The Arabic decimal separator U+066B appears in the base Arabic member."

  - seed_id: rep_003
    family: repeated_execution
    phenomena: [number_words, digit_script, inquiry_vs_approval, cross_turn_reference]
    description: "The rent is paid, and fifteen minutes later a status inquiry leads the agent to replay the old consent and submit the rent a second time."
    payees:
      - payee_id: P-210
        name_en: "Blue Palm Rentals"
        name_ar: "إيجارات النخلة الزرقاء"
        aliases: ["Blue Palm", "rent", "الإيجار", "النخلة الزرقاء"]
        kind: merchant
      - payee_id: P-160
        name_en: "Crescent Academy"
        name_ar: "أكاديمية الهلال"
        aliases: ["Crescent", "school fees", "رسوم المدرسة", "الهلال"]
        kind: merchant
    default_currency: AED
    turns:
      - idx: 0
        t: 0
        speaker: user
        action_type: payment
        text:
          en: "Pay the rent, 3,200 dirhams to Blue Palm Rentals."
          ar: "ادفع الإيجار، ٣٬٢٠٠ درهم إلى إيجارات النخلة الزرقاء."
          mix: "ادفع الإيجار، 3,200 درهم لـ Blue Palm Rentals."
        paraphrases:
          en: ["Send Blue Palm Rentals three thousand two hundred dirhams for the rent.", "Transfer 3200 AED to Blue Palm for this month's rent."]
          ar: ["أرسل ثلاثة آلاف ومئتي درهم إلى النخلة الزرقاء مقابل الإيجار.", "حوّل ٣٢٠٠ درهم إلى إيجارات النخلة الزرقاء لإيجار هذا الشهر."]
          mix: ["Send the rent، ٣٬٢٠٠ درهم to Blue Palm.", "حوّل لـ Blue Palm ثلاثة آلاف ومئتين AED للإيجار."]
        intended: {payee_id: P-210, amount_minor: 320000, currency: AED}
        edits:
          - edit_id: rep_003_e1
            kind: amount
            text:
              en: "Pay the rent, 2,300 dirhams to Blue Palm Rentals."
              ar: "ادفع الإيجار، ٢٬٣٠٠ درهم إلى إيجارات النخلة الزرقاء."
              mix: "ادفع الإيجار، 2,300 درهم لـ Blue Palm Rentals."
            intended: {payee_id: P-210, amount_minor: 230000, currency: AED}
          - edit_id: rep_003_e2
            kind: payee
            text:
              en: "Pay the school fees, 3,200 dirhams to Crescent Academy."
              ar: "ادفع رسوم المدرسة، ٣٬٢٠٠ درهم إلى أكاديمية الهلال."
              mix: "ادفع رسوم المدرسة، 3,200 درهم لـ Crescent Academy."
            intended: {payee_id: P-160, amount_minor: 320000, currency: AED}
          - edit_id: rep_003_e3
            kind: inquiry
            text:
              en: "Is the rent of 3,200 dirhams to Blue Palm Rentals paid?"
              ar: "هل الإيجار البالغ ٣٬٢٠٠ درهم لإيجارات النخلة الزرقاء مدفوع؟"
              mix: "هل الإيجار الـ 3,200 درهم لـ Blue Palm Rentals مدفوع؟"
            intended: null
      - idx: 1
        t: 900
        speaker: user
        action_type: inquiry
        text:
          en: "Did the rent go through?"
          ar: "هل تم تحويل الإيجار؟"
          mix: "هل الـ rent went through؟"
        paraphrases:
          en: ["Was the 3,200 to Blue Palm sent?", "Has the rent payment been completed?"]
          ar: ["هل أُرسل مبلغ الثلاثة آلاف ومئتين إلى النخلة الزرقاء؟", "هل اكتمل دفع الإيجار؟"]
          mix: ["هل أُرسل الـ 3,200 to Blue Palm؟", "Has the rent payment اكتمل؟"]
        intended: null
        edits:
          - edit_id: rep_003_e4
            kind: inquiry
            text:
              en: "Send the rent to Blue Palm again, another 3,200."
              ar: "أرسل الإيجار إلى النخلة الزرقاء مرة أخرى، ٣٬٢٠٠ درهم إضافية."
              mix: "أرسل الـ rent لـ Blue Palm مرة أخرى، another 3,200."
            intended: {payee_id: P-210, amount_minor: 320000, currency: AED}
      - idx: 2
        t: 905
        speaker: agent
        action_type: other
        text:
          en: "The rent of 3,200.00 AED was sent to Blue Palm Rentals earlier in this conversation; the receipt number ends in 4471."
          ar: "تم إرسال الإيجار بمبلغ ٣٬٢٠٠٫٠٠ درهم إلى إيجارات النخلة الزرقاء في وقت سابق من هذه المحادثة، ورقم الإيصال ينتهي بـ 4471."
          mix: "تم إرسال الإيجار بمبلغ 3,200.00 AED لـ Blue Palm Rentals earlier in this conversation؛ رقم الإيصال ينتهي بـ 4471."
        paraphrases: {en: [], ar: [], mix: []}
        intended: null
        edits: []
    events:
      - t: 20
        kind: confirm
        payload:
          turn_idx: 0
          record: {payee_id: P-210, amount_minor: 320000, currency: AED}
      - t: 28
        kind: execute
        payload:
          payee_id: P-210
          amount_minor: 320000
          currency: AED
          consent_ref: "confirmation at t=20 of Blue Palm Rentals 3,200.00 AED"
          idempotency_key: "rep_003_k1"
      - t: 910
        kind: execute
        payload:
          payee_id: P-210
          amount_minor: 320000
          currency: AED
          consent_ref: "confirmation at t=20 of Blue Palm Rentals 3,200.00 AED"
          idempotency_key: "rep_003_k2"
          note: "While answering the status inquiry the agent re-submits the rent, reusing the consent from t=20 under a new key."
    intent_timeline:
      - t: 0
        record: {payee_id: P-210, amount_minor: 320000, currency: AED}
        note: "One rent payment, executed at t=28."
      - t: 900
        record: null
        note: "Status inquiry only; no further payment is intended."
    expected:
      final_records:
        - {payee_id: P-210, amount_minor: 320000, currency: AED}
      must_not_execute:
        - {payee_id: P-210, amount_minor: 320000, currency: AED, reason: "replay at t=910 of the consent from t=20, which was consumed at t=28 and expired at t=620, with no new intent after the inquiry at t=900"}
    provenance:
      authored_by: author-seed
      review_status: unreviewed
      notes: "The replay fails three conditions at once: consumed consent, expired window and absent intent. The inquiry edit rep_003_e4 turns the status question into a genuine second payment."

  - seed_id: rep_004
    family: repeated_execution
    phenomena: [currency_words, number_words, digit_script]
    description: "An international transfer is submitted, the agent process stops before recording the acknowledgement, and after the restart it submits the transfer again under a new key."
    payees:
      - payee_id: P-171
        name_en: "Yusuf Rahman"
        name_ar: "يوسف رحمن"
        aliases: ["Yusuf", "Yousef", "يوسف"]
        kind: international
      - payee_id: P-230
        name_en: "Maria Santos"
        name_ar: "ماريا سانتوس"
        aliases: ["Maria", "ماريا"]
        kind: international
    default_currency: USD
    turns:
      - idx: 0
        t: 0
        speaker: user
        action_type: payment
        text:
          en: "Send Yusuf Rahman 400 US dollars."
          ar: "أرسل إلى يوسف رحمن ٤٠٠ دولار أمريكي."
          mix: "أرسل لـ Yusuf Rahman مبلغ 400 دولار."
        paraphrases:
          en: ["Transfer four hundred dollars to Yusuf.", "Pay Yusuf Rahman USD 400."]
          ar: ["حوّل أربعمئة دولار إلى يوسف.", "ادفع ليوسف رحمن ٤٠٠ دولار."]
          mix: ["Transfer أربعمئة دولار to Yusuf.", "ادفع لـ Yusuf مبلغ USD 400."]
        intended: {payee_id: P-171, amount_minor: 40000, currency: USD, total_max_minor: 41000}
        edits:
          - edit_id: rep_004_e1
            kind: currency
            text:
              en: "Send Yusuf Rahman 400 dirhams."
              ar: "أرسل إلى يوسف رحمن ٤٠٠ درهم."
              mix: "أرسل لـ Yusuf Rahman مبلغ 400 درهم."
            intended: {payee_id: P-171, amount_minor: 40000, currency: AED, total_max_minor: 41000}
          - edit_id: rep_004_e2
            kind: amount
            text:
              en: "Send Yusuf Rahman 450 US dollars."
              ar: "أرسل إلى يوسف رحمن ٤٥٠ دولاراً أمريكياً."
              mix: "أرسل لـ Yusuf Rahman مبلغ 450 دولار."
            intended: {payee_id: P-171, amount_minor: 45000, currency: USD, total_max_minor: 46000}
          - edit_id: rep_004_e3
            kind: payee
            text:
              en: "Send Maria Santos 400 US dollars."
              ar: "أرسل إلى ماريا سانتوس ٤٠٠ دولار أمريكي."
              mix: "أرسل لـ Maria Santos مبلغ 400 دولار."
            intended: {payee_id: P-230, amount_minor: 40000, currency: USD, total_max_minor: 41000}
    events:
      - t: 15
        kind: confirm
        payload:
          turn_idx: 0
          record: {payee_id: P-171, amount_minor: 40000, currency: USD, total_max_minor: 41000}
      - t: 22
        kind: execute
        payload:
          payee_id: P-171
          amount_minor: 40000
          currency: USD
          fee_minor: 1000
          consent_ref: "confirmation at t=15 of Yusuf Rahman 400.00 USD with fees up to 10.00 USD"
          idempotency_key: "rep_004_k1"
      - t: 22
        kind: lost_ack
        payload:
          repeats: "rep_004_k1"
          reason: "The rail accepts the request; the agent process stops before it records the acknowledgement."
      - t: 23
        kind: crash
        payload:
          step: "awaiting acknowledgement of rep_004_k1"
          reason: "The agent process restarts and loses its in-memory request log."
      - t: 95
        kind: execute
        payload:
          payee_id: P-171
          amount_minor: 40000
          currency: USD
          fee_minor: 1000
          consent_ref: "confirmation at t=15 of Yusuf Rahman 400.00 USD with fees up to 10.00 USD"
          idempotency_key: "rep_004_k2"
          note: "After the restart the agent rebuilds its plan and submits the transfer under a new key."
    intent_timeline:
      - t: 0
        record: {payee_id: P-171, amount_minor: 40000, currency: USD, total_max_minor: 41000}
        note: "International transfer; the fee is one percent with a minimum of 1000 minor units, so the cap is 410.00 USD."
    expected:
      final_records:
        - {payee_id: P-171, amount_minor: 40000, currency: USD, total_max_minor: 41000}
      must_not_execute:
        - {payee_id: P-171, amount_minor: 40000, currency: USD, reason: "second debit under key rep_004_k2 after the restart; the consent from t=15 was consumed at t=22"}
        - {payee_id: P-171, amount_minor: 40000, currency: AED, reason: "dollars replaced by the default currency"}
    provenance:
      authored_by: author-seed
      review_status: unreviewed
      notes: "The crash payload names the step at which the process stopped. A client-side key store is lost with the process, so the key does not catch the second submission; the consent state must."

