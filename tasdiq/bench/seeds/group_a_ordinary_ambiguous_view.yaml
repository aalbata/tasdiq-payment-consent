seeds:
  - seed_id: "ord_001"
    family: "ordinary_valid"
    phenomena: ["code_switching", "arabizi", "digit_script", "number_words"]
    description: "A single domestic transfer of 250 dirhams to a friend is requested, confirmed on the surface and executed once within the window."
    payees:
      - payee_id: "P-114"
        name_en: "Omar Khalid"
        name_ar: "عمر خالد"
        aliases: ["Omar", "Omar K", "3omar", "3omar khalid", "عمر"]
        kind: "domestic"
        iban_masked: "AE** **** 4471"
      - payee_id: "P-120"
        name_en: "Layla Hassan"
        name_ar: "ليلى حسن"
        aliases: ["Layla", "Laila", "ليلى"]
        kind: "domestic"
        iban_masked: "AE** **** 9028"
    default_currency: "AED"
    turns:
      - idx: 0
        t: 0
        speaker: "user"
        action_type: "payment"
        text:
          en: "Please send 250 dirhams to Omar Khalid."
          ar: "من فضلك أرسل ٢٥٠ درهماً إلى عمر خالد."
          mix: "من فضلك حوّل 250 AED إلى Omar Khalid."
        paraphrases:
          en: ["Transfer AED 250 to Omar Khalid, please.", "I want to pay Omar Khalid two hundred and fifty dirhams."]
          ar: ["حوّل مئتين وخمسين درهماً إلى عمر خالد من فضلك.", "أريد أن أدفع 250 درهماً لعمر خالد."]
          mix: ["Send 250 درهم to 3omar Khalid please.", "ادفع لـ Omar Khalid مبلغ two hundred and fifty dirhams."]
        intended: {payee_id: "P-114", amount_minor: 25000, currency: "AED"}
        edits:
          - edit_id: "ord_001_e1"
            kind: "amount"
            text:
              en: "Please send 350 dirhams to Omar Khalid."
              ar: "من فضلك أرسل ٣٥٠ درهماً إلى عمر خالد."
              mix: "من فضلك حوّل 350 AED إلى Omar Khalid."
            intended: {payee_id: "P-114", amount_minor: 35000, currency: "AED"}
          - edit_id: "ord_001_e2"
            kind: "payee"
            text:
              en: "Please send 250 dirhams to Layla Hassan."
              ar: "من فضلك أرسل ٢٥٠ درهماً إلى ليلى حسن."
              mix: "من فضلك حوّل 250 AED إلى Layla Hassan."
            intended: {payee_id: "P-120", amount_minor: 25000, currency: "AED"}
          - edit_id: "ord_001_e3"
            kind: "inquiry"
            text:
              en: "How much would it cost to send 250 dirhams to Omar Khalid?"
              ar: "كم سيكلف إرسال ٢٥٠ درهماً إلى عمر خالد؟"
              mix: "كم سيكلف تحويل 250 AED إلى Omar Khalid؟"
            intended: null
      - idx: 1
        t: 4
        speaker: "agent"
        action_type: "other"
        text:
          en: "Please confirm on the payment screen: 250.00 AED to Omar Khalid (P-114), no fee."
          ar: "يرجى التأكيد على شاشة الدفع: ٢٥٠٫٠٠ درهم إلى عمر خالد (P-114)، بدون رسوم."
          mix: "يرجى التأكيد على شاشة الدفع: 250.00 AED إلى Omar Khalid (P-114)، بدون رسوم."
        paraphrases: {en: [], ar: [], mix: []}
        intended: null
        edits: []
    events:
      - t: 20
        kind: "confirm"
        payload:
          turn_idx: 0
          record: {payee_id: "P-114", amount_minor: 25000, currency: "AED"}
      - t: 28
        kind: "execute"
        payload:
          payee_id: "P-114"
          amount_minor: 25000
          currency: "AED"
          consent_ref: "confirmation at t=20 of Omar Khalid 250.00 AED"
          idempotency_key: "ord_001_k1"
    intent_timeline:
      - t: 0
        record: {payee_id: "P-114", amount_minor: 25000, currency: "AED"}
        note: "Initial request; the intent is unchanged for the rest of the scenario."
    expected:
      final_records:
        - {payee_id: "P-114", amount_minor: 25000, currency: "AED"}
      must_not_execute:
        - {payee_id: "P-120", amount_minor: 25000, currency: "AED", reason: "Layla Hassan is a directory neighbour, not the intended payee"}
        - {payee_id: "P-114", amount_minor: 35000, currency: "AED", reason: "350 is a misread of the stated 250"}
    provenance:
      authored_by: "author-seed"
      review_status: "unreviewed"
      notes: "The directory contains Layla Hassan as a neighbour; the payee edit targets it. One confirmation, one execution eight seconds later; any second debit of the same consent would be a duplicate."
